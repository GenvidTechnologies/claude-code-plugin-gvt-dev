name: leak-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  leak-grep:
    runs-on: ubuntu-latest
    # This job is a few greps over tracked files — it should finish in well
    # under a minute. A generous cap still fails fast when the runner hangs
    # rather than letting it burn the default 6h budget: during the 2026-08-06
    # Actions outage one run sat 15 minutes before being cancelled, which reads
    # as a content failure at a glance when it never ran a line of its own logic.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Org-specific leak grep
        run: |
          set -euo pipefail
          # Always blocked, everywhere: local filesystem paths and usernames
          # are never legitimate in a committed file.
          always='C:/repos/|C:/Users/|fninoles'
          # Blocked in code/config only: the `@genvidtech` npm scope is a public
          # org, so naming a `@genvidtech/...` package in prose docs (CHANGELOG,
          # *.md) is fine — but it should not be hardcoded in code/config/CI.
          code_only='@genvidtech|genvidtech/'
          # Exclude this workflow file itself: it necessarily contains the
          # patterns above as its own definition, which would self-match.
          guard=':!.github/workflows/leak-guard.yml'
          found=0
          if git ls-files -- "$guard" | xargs grep -nE "$always"; then
            echo "::error::leak pattern found (local path / username — blocked everywhere)"
            found=1
          fi
          if git ls-files -- "$guard" ':!*.md' | xargs grep -nE "$code_only"; then
            echo "::error::internal npm-scope reference found in a non-doc file"
            found=1
          fi
          if [ "$found" -ne 0 ]; then exit 1; fi
          echo "no leak patterns found"
